name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      # Multi-arch manifest on GHCR: RouterOS can pull this directly
      # (registry-url=https://ghcr.io, remote-image=<repo>:latest)
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # One docker-save tar per platform, ready for /container add file=...
      - name: Export per-platform tars
        run: |
          set -eu
          mkdir -p dist
          for p in amd64 arm64 "arm/v7"; do
            safe=$(echo "$p" | tr '/' '-')
            docker buildx build --platform "linux/$p" \
              --output "type=docker,dest=dist/wg-portal-$safe.tar" \
              -t wg-portal:$safe .
          done
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wg-portal-routeros-tars
          path: dist/*.tar
          retention-days: 90

      # On version tags, also attach the tars to a GitHub Release
      # so they can be downloaded without logging in.
      - name: Release tars
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar
